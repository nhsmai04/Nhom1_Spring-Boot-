<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>NXH</title>
    <!-- Bootstrap 5 CDN (Đã sửa) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <style>
        .action-btn {
            margin-right: 5px;
        }
        .btn-circle {
            width: 48px;
            height: 48px;
            padding: 6px 0;
            border-radius: 50%;
            text-align: center;
            font-size: 24px;
            line-height: 1.42857;
        }
    </style>
</head>
<body class="container py-5">

<h1 class="mb-4 text-center text-primary">🏠 Nhà phát hành</h1>

<!-- Bảng danh sách người dùng -->
<div class="card mb-4 shadow">
    <div class="card-header bg-info text-white">
        <h4 class="mb-0">📋 Danh sách nhà xuất bản</h4>
    </div>
    <div class="card-body">
        <div class="table-responsive">
            <table class="table table-striped table-hover mb-0">
                <thead class="table-primary text-center">
                <tr>
                    <th>ID</th>
                    <th>Tên</th>
                </tr>
                </thead>
                <tbody class="text-center">
                <tr th:each="publisher : ${publishers}">
                    <td th:text="${publisher.id}">1</td>
                    <td th:text="${publisher.name}">Nguyễn</td>

                </tr>
                <tr th:if="${#lists.isEmpty(publishers)}">
                    <td colspan="6" class="text-muted text-center py-3">Chưa có nhà xuất bản nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<!-- Nút thêm người dùng (hình tròn, chứa dấu +) -->


</body>
</html>
