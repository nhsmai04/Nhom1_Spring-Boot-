<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

<!-- Header fragment -->
<th:block th:replace="~{fragments/header :: header}"></th:block>

<div class="login-container">
    <form th:action="@{/login}" method="post" class="login-form">
        <h2 class="login-title">Đăng nhập</h2>

        <div class="form-group">
            <label for="username">Email</label>
            <input type="text" id="username" name="username" placeholder="VD: abc@gmail.com" required />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="********" required />
            <small>Độ dài tối thiểu 8 ký tự, có ít nhất 3 loại ký tự: chữ thường, viết hoa, số, ký tự đặc biệt.</small>
        </div>

        <div class="form-options">
            <label class="checkbox-label"><input type="checkbox" name="remember-me" class="custom-checkbox" /> Ghi nhớ đăng nhập</label>
            <a href="#" class="forgot-link">Quên mật khẩu?</a>
        </div>

        <button type="submit" class="btn btn-primary">Đăng nhập</button>
		<div class="divider"></div>
        <div class="login-divider">Hoặc đăng nhập với:</div>
        <div class="social-login">
            <button type="button" class="btn btn-social">Google</button>
            <button type="button" class="btn btn-social">Facebook</button>
        </div>
		
		<div class="divider"></div>
        <div class="login-footer">
            Chưa có tài khoản? <a href="#">Đăng ký</a>
        </div>

        <div th:if="${param.error}" class="login-error">
            Tài khoản hoặc mật khẩu không đúng.
        </div>
        <div th:if="${param.logout}" class="login-logout">
            Bạn đã đăng xuất thành công.
        </div>
    </form>
</div>

</body>
</html>
